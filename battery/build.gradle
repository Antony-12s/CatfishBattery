plugins {
    id 'com.android.application'
}

// Standalone Catfish Battery APK: the Custom Profiles Battery pages without Custom Profiles.
android {
    namespace 'com.catfish.battery'
    compileSdk 33

    defaultConfig {
        applicationId "com.catfish.battery"
        minSdk 30
        targetSdk 33
        versionCode 11
        versionName "1.6.4"
        // shown in Settings > About
        buildConfigField "long", "BUILD_TIME", "${System.currentTimeMillis()}L"
        buildConfigField "String", "GIT_COMMIT", "\"${providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD' }.standardOutput.asText.get().trim()}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            // Same signer as :app and :split (the developer's ~/.android/debug.keystore).
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "catfish_battery_${variant.versionName}_${variant.buildType.name}.apk"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'io.grpc:grpc-okhttp:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'
    implementation 'com.google.zxing:core:3.5.3' // Ko-fi QR in Settings > About
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

